; ====================================================================
; PlatformIO Project Configuration for ESP8266 Remote OTA
; ====================================================================
; Compatible with:
; - NodeMCU v2 / v3
; - Wemos D1 Mini / Pro
; - Generic ESP-12E / ESP-12F / ESP-07
; ====================================================================

[platformio]
default_envs = nodemcuv2
src_dir = ESP8266_RemoteOTA

[env]
platform = espressif8266
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Boost CPU to 160MHz for significantly faster BearSSL TLS handshakes
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs

; Build flags: tune BearSSL memory and optimize binary size
build_flags = 
    -D BEARSSL_SSL_BASIC
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS=0

; --------------------------------------------------------------------
; Environment: NodeMCU v2 (4MB Flash, 1MB LittleFS, ~1MB OTA Slot)
; --------------------------------------------------------------------
[env:nodemcuv2]
board = nodemcuv2
board_build.ldscript = eagle.flash.4m1m.ld

; --------------------------------------------------------------------
; Environment: Wemos D1 Mini (4MB Flash, 1MB LittleFS, ~1MB OTA Slot)
; --------------------------------------------------------------------
[env:d1_mini]
board = d1_mini
board_build.ldscript = eagle.flash.4m1m.ld

; --------------------------------------------------------------------
; Environment: Generic ESP8266 (ESP-01 / ESP-01S with 1MB Flash)
; Note: 1MB boards have ~450KB sketch space. Binaries must stay small.
; --------------------------------------------------------------------
[env:esp01_1m]
board = esp01_1m
board_build.ldscript = eagle.flash.1m64.ld
